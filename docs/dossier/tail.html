<script>
function hemi(o){
  const rows=o.rows, rin=o.rin, rout=o.rout, n=o.n; let radii=[],counts=[];
  for(let i=0;i<rows;i++) radii.push(rin+(rout-rin)*i/(rows-1||1));
  if(o.counts){counts=o.counts.slice();}
  else{const s=radii.reduce((a,b)=>a+b,0);counts=radii.map(r=>Math.round(n*r/s));let d=n-counts.reduce((a,b)=>a+b,0),i=rows-1;while(d!==0){counts[i]+=Math.sign(d);d-=Math.sign(d);i=(i-1+rows)%rows;}}
  const pad=o.dot+1,W=2*(rout+pad),H=rout+2*pad;let c='';
  counts.forEach((cnt,ri)=>{for(let k=0;k<cnt;k++){const a=Math.PI-(Math.PI*(k+0.5)/cnt)*(1-2*(o.gap||0))-Math.PI*(o.gap||0);
    const x=(rout+pad)+radii[ri]*Math.cos(a), y=(rout+pad)-radii[ri]*Math.sin(a);
    const hi=o.hi&&o.hi[0]===ri&&o.hi[1]===k;
    c+=`<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${hi?(o.dot*(o.hiScale||1)).toFixed(2):o.dot}" fill="${hi?o.hiColor:o.color}"${hi?'':` opacity="${o.op||1}"`}/>`;}});
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" style="display:block;width:100%">${c}</svg>`;
}
window.MZ={
  logo:(dark)=>hemi({rows:3,rin:9,rout:23,counts:[5,8,11],dot:2.5,color:dark?'#141B2D':'#F7F3EA',hi:[0,2],hiColor:dark?'#B08A3E':'#D8BC7A'}),
  cover:()=>hemi({n:348,rows:9,rin:34,rout:100,dot:2.35,color:'#F7F3EA',op:.32,hi:[4,24],hiColor:'#D8BC7A',hiScale:1.25}),
  page:()=>hemi({n:348,rows:9,rin:34,rout:100,dot:2.35,color:'#141B2D',op:.85,hi:[4,24],hiColor:'#B08A3E',hiScale:1.3}),
  post:()=>hemi({n:348,rows:9,rin:34,rout:100,dot:2.3,color:'#F7F3EA',op:.3,hi:[3,10],hiColor:'#D8BC7A',hiScale:1.5})
};
document.querySelectorAll('[data-logo]').forEach(e=>{e.style.display='inline-block';e.style.width=e.dataset.s+'mm';e.style.flex='none';e.innerHTML=MZ.logo(e.dataset.logo==='dark');});
document.querySelectorAll('[data-hemi]').forEach(e=>{e.innerHTML=MZ[e.dataset.hemi]();});
</script>
</body>
</html>
