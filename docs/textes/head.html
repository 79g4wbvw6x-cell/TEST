<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mandat Zéro — Recueil des textes</title>
<style>
@font-face{font-family:IS;src:url('../dossier/fonts/instrument-serif-latin-400-normal.woff2') format('woff2');font-style:normal}
@font-face{font-family:IS;src:url('../dossier/fonts/instrument-serif-latin-400-italic.woff2') format('woff2');font-style:italic}
@font-face{font-family:DM;src:url('../dossier/fonts/dm-sans-latin-400-normal.woff2') format('woff2');font-weight:400}
@font-face{font-family:DM;src:url('../dossier/fonts/dm-sans-latin-500-normal.woff2') format('woff2');font-weight:500}
@font-face{font-family:DM;src:url('../dossier/fonts/dm-sans-latin-700-normal.woff2') format('woff2');font-weight:700}
:root{--ink:#141B2D;--paper:#F7F3EA;--paper2:#EEE7D6;--white:#FFFDF8;--gold:#B08A3E;--goldd:#86661F;--goldl:#D8BC7A;--stone:#6F6A5C;--line:#D9D0BC}
@page{size:A4;margin:17mm 19mm 19mm}
@page :first{margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#fff}
body{font-family:DM,Arial,sans-serif;color:var(--ink);font-size:9.4pt;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff}
.cover{height:297mm;background:var(--ink);color:var(--paper);padding:22mm 20mm;position:relative;page-break-after:always}
.cover .wm{display:flex;align-items:center;gap:3.5mm;font-family:IS,Georgia,serif;font-size:15pt}
.cover h1{font-family:IS,Georgia,serif;font-weight:400;font-size:58pt;line-height:.95;margin-top:70mm}
.cover h1 em{color:var(--goldl)}
.cover p{font-size:11pt;line-height:1.55;color:#B9BCC7;max-width:120mm;margin-top:7mm}
.cover .meta{position:absolute;left:20mm;right:20mm;bottom:18mm;display:flex;justify-content:space-between;font-size:7.6pt;letter-spacing:.16em;text-transform:uppercase;color:#9499A8;border-top:.3mm solid #33405e;padding-top:4mm}
.kicker{font-size:7.4pt;letter-spacing:.22em;text-transform:uppercase;color:var(--goldd);font-weight:700;margin-bottom:3mm;display:flex;align-items:center;gap:3mm}
.kicker::after{content:"";flex:1;height:.3mm;background:var(--line)}
h2{font-family:IS,Georgia,serif;font-weight:400;font-size:27pt;line-height:1.05;margin-bottom:3mm;break-after:avoid}
h2 em{color:var(--goldd)}
.texte{break-before:page}
.intro{font-size:10.4pt;line-height:1.5;color:#262d40;margin-bottom:5mm;max-width:160mm}
h3{font-size:7.6pt;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--goldd);margin:5.5mm 0 2mm;border-top:.5mm solid var(--ink);padding-top:2.5mm;break-after:avoid}
.a{margin-bottom:2.6mm;break-inside:avoid}
.a b.t{font-family:IS,Georgia,serif;font-weight:400;font-size:12pt;display:block;margin-bottom:.6mm;line-height:1.2}
.a p{margin-bottom:1.2mm}
.a ol,.a ul{margin:1mm 0 1mm 5mm}
.a li{margin-bottom:.6mm}
.note{background:var(--paper2);padding:3.2mm 4mm;border-left:.8mm solid var(--gold);font-size:8.6pt;line-height:1.45;margin:3mm 0 4mm;break-inside:avoid}
.cols{columns:2;column-gap:8mm}
.blank{display:inline-block;border-bottom:.3mm solid var(--ink);min-width:42mm;height:4mm;vertical-align:bottom}
.form{background:var(--white);border:.3mm solid var(--line);padding:5mm;margin-top:3mm;break-inside:avoid}
.form p{margin-bottom:2.6mm}
.cb{display:inline-block;width:3.2mm;height:3.2mm;border:.35mm solid var(--ink);vertical-align:-.4mm;margin-right:1.6mm}
table{width:100%;border-collapse:collapse;font-size:8.8pt;margin:2mm 0 3mm}
th{text-align:left;font-size:6.8pt;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);padding:0 2.5mm 1.8mm;border-bottom:.5mm solid var(--ink)}
td{padding:2mm 2.5mm;border-bottom:.3mm solid var(--line);vertical-align:top}
</style>
</head>
<body>
